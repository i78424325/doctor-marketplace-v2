# Админка сайта «Доктор Маркетплейс» (Sveltia CMS): разделы называются как части сайта, без лишней вложенности.
# Правки сохраняются в репозиторий, сайт пересобирается сам (GitHub Actions → build.py).
# При переезде на свой домен поменять repo; адреса сайта ({{base}}, {{site}}) подставляет build.py.
app_title: 'Доктор Маркетплейс — админка'
logo:
  src: '{{base}}favicon.svg'
  show_in_header: true
backend:
  name: github
  repo: i78424325/doctor-marketplace-v2
  branch: main
  auth_methods: [token]  # вход по ключу доступа или по ссылке со страницы admin/ssylka.html
  commit_messages:
    create: 'Админка: добавлено «{{slug}}» ({{collection}})'
    update: 'Админка: изменено «{{slug}}» ({{collection}})'
    delete: 'Админка: удалено «{{slug}}» ({{collection}})'
    uploadMedia: 'Админка: загружен файл {{path}}'
    deleteMedia: 'Админка: удалён файл {{path}}'
site_url: '{{site}}'
display_url: '{{site}}'
media_folder: src/img/uploads
public_folder: /img/uploads
media_libraries:
  default:
    config:
      slugify_filename: true
field_defaults:
  richtext:
    buttons: [bold, italic, link, heading-two, heading-three, heading-four, quote, bulleted-list, numbered-list]
    editor_components: [image]
editor:
  preview: false  # одна колонка: только поля, без дублирующей панели «Просмотр»

singletons:
  - name: help
    label: 'Как пользоваться админкой'
    icon: help
    file: content/help.json
    readonly: true
    fields:
      - { name: text, label: 'Коротко о главном', widget: richtext }

  - name: home
    label: 'Главная страница'
    icon: home
    file: content/home.json
    fields:
      - name: hero
        label: 'Первый экран'
        widget: object
        collapsed: false
        fields:
          - { name: chip, label: 'Надпись над заголовком', widget: string }
          - { name: title, label: 'Заголовок', widget: string, hint: '[WB] — Wildberries в фирменном цвете, [OZON] — Ozon, [слова в скобках] — зелёный акцент с растущей линией' }
          - { name: lead, label: 'Подзаголовок', widget: text }
          - { name: button, label: 'Текст главной кнопки', widget: string }
      - name: sections
        label: 'Порядок блоков на главной'
        label_singular: 'блок'
        hint: 'Перетащите блок за значок слева, чтобы поменять порядок. Удалите блок, чтобы скрыть его'
        widget: list
        summary: '{{fields.type}}'
        fields:
          - name: type
            label: 'Блок'
            widget: select
            options:
              - { label: 'Наши клиенты — бегущая строка логотипов', value: clients }
              - { label: 'Это про вас? — три карточки', value: who }
              - { label: 'Услуги — плитки', value: services }
              - { label: 'Цифры', value: stats }
              - { label: 'Большая фраза', value: tagline }
              - { label: 'Основатель', value: founder }
              - { label: 'Новости — три последние', value: news }
              - { label: 'Как мы работаем — шаги', value: steps }
              - { label: 'Частые вопросы', value: faq }
              - { label: 'Призыв записаться', value: cta }
      - name: who
        label: 'Блок «Это про вас?»'
        widget: object
        collapsed: true
        fields:
          - { name: chip, label: 'Надпись над заголовком', widget: string }
          - { name: title, label: 'Заголовок', widget: string }
          - name: cards
            label: 'Карточки'
            label_singular: 'карточку'
            widget: list
            collapsed: true
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: 'Метка', widget: string, hint: 'Например: 01 · Старт' }
              - { name: title, label: 'Заголовок', widget: string, hint: '*Слова в звёздочках* выделяются зелёным' }
              - { name: items, label: 'Пункты', widget: list, field: { name: item, label: 'Пункт', widget: string } }
              - { name: link_text, label: 'Текст ссылки', widget: string, required: false }
              - { name: link, label: 'Куда ведёт ссылка', widget: string, required: false, hint: 'Например: uslugi/podbor-nishi/' }
      - name: services_block
        label: 'Блок «Услуги» — заголовок'
        widget: object
        collapsed: true
        fields:
          - { name: chip, label: 'Надпись над заголовком', widget: string }
          - { name: title, label: 'Заголовок', widget: string }
      - { name: tagline, label: 'Большая фраза', widget: text, hint: '*Слова в звёздочках* выделяются зелёным' }
      - name: founder
        label: 'Блок «Основатель»'
        widget: object
        collapsed: true
        fields:
          - { name: chip, label: 'Надпись', widget: string }
          - { name: name, label: 'Имя', widget: string }
          - { name: role, label: 'Должность', widget: string }
          - { name: photo, label: 'Фото', widget: image, required: false, hint: 'Квадратное, лучше от 800×800. Пусто — нынешнее фото' }
          - { name: items, label: 'Достижения', widget: list, field: { name: item, label: 'Пункт', widget: string } }
      - name: news_block
        label: 'Блок «Новости» — заголовок'
        widget: object
        collapsed: true
        fields:
          - { name: chip, label: 'Надпись над заголовком', widget: string }
          - { name: title, label: 'Заголовок', widget: string }

  - name: services
    label: 'Услуги, цены и кейсы'
    icon: work
    file: content/services.json
    fields:
      - name: services
        label: 'Услуги'
        label_singular: 'услугу'
        hint: 'Нажмите на услугу, чтобы открыть её. Первая в списке — большая плитка на главной. Порядок — перетаскиванием'
        widget: list
        collapsed: true
        summary: '{{fields.title}}'
        fields:
          - { name: title, label: 'Название', widget: string }
          - { name: price_from, label: 'Цена «от», ₽', widget: string, required: false, pattern: ['^[0-9 ]*$', 'Только число, например 15000'], hint: 'Только число, например 15000. Пусто — на сайте «Цена от … ₽»' }
          - { name: short, label: 'Короткое описание', widget: string }
          - { name: items, label: 'Что входит', widget: list, field: { name: item, label: 'Пункт', widget: string } }
          - name: cases
            label: 'Кейсы'
            label_singular: 'кейс'
            widget: list
            required: false
            collapsed: true
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: 'Заголовок кейса', widget: string, hint: 'Например: Магазин посуды на Wildberries' }
              - { name: image, label: 'Фото', widget: image, required: false }
              - { name: result, label: 'Главный результат одной строкой', widget: string, required: false }
              - name: results
                label: 'Цифры результата'
                label_singular: 'цифру'
                widget: list
                required: false
                summary: '{{fields.value}} {{fields.label}}'
                fields:
                  - { name: value, label: 'Цифра', widget: string, hint: 'Например: ×3 или +240%' }
                  - { name: label, label: 'Подпись', widget: string, hint: 'Например: выручка за 2 месяца' }
              - { name: video, label: 'Видео', widget: file, required: false, hint: 'Ссылка VK Видео, Rutube, YouTube или файл mp4' }
              - { name: text, label: 'Описание', widget: richtext, required: false }
          - { name: tile_text, label: 'Подпись в плитке на главной', widget: string, required: false, hint: 'Пусто — короткое описание' }
          - name: icon
            label: 'Значок'
            widget: select
            default: check-circle
            options:
              - { label: 'График роста', value: chart-line-up }
              - { label: 'Рупор', value: megaphone }
              - { label: 'Палитра', value: palette }
              - { label: 'Камера', value: camera }
              - { label: 'Чат', value: chats-circle }
              - { label: 'Цель', value: target }
              - { label: 'Поиск', value: magnifying-glass }
              - { label: 'Сайт', value: browser }
              - { label: 'Ракета', value: rocket-launch }
              - { label: 'Магазин', value: storefront }
              - { label: 'Коробка', value: package }
              - { label: 'Доставка', value: truck }
              - { label: 'Звезда', value: star }
              - { label: 'Печать качества', value: seal-check }
              - { label: 'Щит', value: shield-check }
              - { label: 'Молния', value: lightning }
              - { label: 'Команда', value: users-three }
              - { label: 'Столбцы', value: chart-bar }
              - { label: 'Оплата', value: credit-card }
              - { label: 'Галочка', value: check-circle }
          - { name: slug, label: 'Адрес страницы латиницей', widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Латиница и цифры, слова через дефис: reklama-ozon'], hint: 'reklama → сайт/uslugi/reklama/. У «Сайта для селлера» — sait. Не должны повторяться' }

  - name: video
    label: 'Видео-визитка'
    icon: smart_display
    file: content/video.json
    fields:
      - { name: url, label: 'Видео', widget: file, required: false, hint: 'Ссылка на VK Видео, Rutube или YouTube, код вставки (iframe) — или файл mp4 до 50 МБ. Пусто — карточка «Скоро здесь»' }
      - { name: poster, label: 'Обложка — кадр из видео', widget: image, required: false, hint: 'Горизонтальная или квадратная картинка' }
      - { name: caption, label: 'Подпись', widget: string }

  - name: clients
    label: 'Наши клиенты — логотипы'
    icon: handshake
    file: content/clients.json
    fields:
      - { name: title, label: 'Заголовок блока', widget: string }
      - name: logos
        label: 'Логотипы'
        label_singular: 'логотип'
        hint: 'Строка бежит слева направо. Порядок — перетаскиванием'
        widget: list
        required: false
        collapsed: auto
        summary: '{{fields.name}}'
        fields:
          - { name: name, label: 'Название клиента', widget: string }
          - { name: image, label: 'Логотип', widget: image, hint: 'PNG или SVG с прозрачным фоном' }
          - { name: url, label: 'Ссылка на магазин (необязательно)', widget: string, required: false }

  - name: contacts
    label: 'Контакты и мессенджеры'
    icon: call
    file: content/settings.json
    fields:
      - { name: company_name, label: 'Название компании', widget: string }
      - { name: phone, label: 'Телефон — как показывать', widget: string, hint: 'Например: 8 931 009-10-14' }
      - { name: phone_href, label: 'Телефон для звонка', widget: string, hint: 'Только цифры с плюсом: +79310091014', pattern: ['^\+?\d{10,15}$', 'Только цифры, можно с плюсом в начале'] }
      - { name: email, label: 'Почта', widget: string }
      - { name: max_url, label: 'MAX — бот для заявок', widget: string, required: false, pattern: ['^https://(web\.)?max\.ru/\S+$', 'Ссылка вида https://max.ru/имя_бота'], hint: 'По ней ведут кнопки MAX и QR-код. Пусто — ведут на страницу контактов' }
      - { name: telegram_url, label: 'Telegram — бот для заявок', widget: string, required: false, pattern: ['^https://t\.me/\S+$', 'Ссылка вида https://t.me/имя_бота'], hint: 'По ней ведут кнопки Telegram и QR-код. Пусто — ведут на страницу контактов' }
      - { name: manager_max_url, label: 'MAX менеджера (необязательно)', widget: string, required: false, pattern: ['^https://(web\.)?max\.ru/\S+$', 'Ссылка вида https://max.ru/имя'], hint: 'Ссылки под чатом поведут прямо к менеджеру' }
      - { name: manager_telegram_url, label: 'Telegram менеджера (необязательно)', widget: string, required: false, pattern: ['^https://t\.me/\S+$', 'Ссылка вида https://t.me/имя'] }
      - { name: chat_label, label: 'Надпись на кнопке чата', widget: string, default: 'Напишите нам, мы онлайн' }
      - { name: chat_greeting, label: 'Первое сообщение в чате', widget: string }
      - { name: footer_text, label: 'Текст в подвале сайта', widget: text }
      - { name: logo, label: 'Логотип (квадратный значок)', widget: image, required: false, hint: 'Пусто — фирменный значок с пульсом. Лучше PNG или SVG 128×128' }
      - { name: lead_endpoint, label: 'Адрес приёма заявок (заполняет разработчик)', widget: string, required: false, hint: 'Сервер, который передаёт заявки в amoCRM и менеджеру. Пусто — формы работают в демо-режиме' }

  - name: faq
    label: 'Вопросы и ответы'
    icon: quiz
    file: content/faq.json
    fields:
      - name: items
        label: 'Вопросы'
        label_singular: 'вопрос'
        hint: 'Нажмите на вопрос, чтобы открыть его. Порядок — перетаскиванием'
        widget: list
        collapsed: true
        summary: '{{fields.q}}'
        fields:
          - { name: q, label: 'Вопрос', widget: string }
          - { name: a, label: 'Ответ', widget: text, hint: 'Пустая строка — новый абзац' }
          - { name: topic, label: 'Раздел', widget: select, required: false, default: general, options: [{ label: 'Общий вопрос', value: general }, { label: 'Вопрос о сайте для селлера', value: site }], hint: 'Вопросы о сайте показываются на странице «Сайт для селлера»' }

  - divider: true

  - name: stats
    label: 'Цифры'
    icon: bar_chart
    file: content/stats.json
    fields:
      - name: items
        label: 'Цифры'
        label_singular: 'цифру'
        widget: list
        summary: '{{fields.value}} — {{fields.label}}'
        fields:
          - { name: value, label: 'Цифра', widget: string, hint: 'Например: 6 000+ или 93%' }
          - { name: label, label: 'Подпись', widget: string }

  - name: steps
    label: 'Шаги «Как мы работаем»'
    icon: format_list_numbered
    file: content/steps.json
    fields:
      - name: items
        label: 'Шаги работы'
        label_singular: 'шаг'
        widget: list
        summary: '{{fields.title}}'
        fields:
          - { name: title, label: 'Шаг', widget: string }
          - { name: text, label: 'Описание', widget: string }
      - name: site
        label: 'Шаги на странице «Сайт для селлера»'
        label_singular: 'шаг'
        widget: list
        collapsed: true
        summary: '{{fields.title}}'
        fields:
          - { name: title, label: 'Шаг', widget: string }
          - { name: text, label: 'Описание', widget: string }

  - name: texts
    label: 'Заголовки страниц'
    icon: title
    file: content/texts.json
    fields:
      - { name: uslugi, label: 'Страница «Услуги»', widget: object, collapsed: true, fields: [{ name: title, label: 'Заголовок', widget: string }, { name: lead, label: 'Подзаголовок', widget: text }] }
      - name: o_nas
        label: 'Страница «О компании»'
        widget: object
        collapsed: true
        fields:
          - { name: title, label: 'Заголовок', widget: string }
          - { name: lead, label: 'Подзаголовок', widget: text }
          - name: why
            label: 'Почему мы — карточки'
            label_singular: 'карточку'
            widget: list
            summary: '{{fields.text}}'
            fields:
              - { name: icon, label: 'Значок', widget: select, options: [chart-bar, clock, users-three, shield-check, seal-check, target, lightning, star, chart-line-up, rocket-launch] }
              - { name: text, label: 'Текст', widget: string }
      - { name: voprosy, label: 'Страница «Вопросы»', widget: object, collapsed: true, fields: [{ name: title, label: 'Заголовок', widget: string }, { name: lead, label: 'Подзаголовок', widget: text }] }
      - name: kontakty
        label: 'Страница «Контакты»'
        widget: object
        collapsed: true
        fields:
          - { name: title, label: 'Заголовок', widget: string }
          - { name: lead, label: 'Подзаголовок', widget: text }
          - { name: meeting, label: 'Что будет на встрече', widget: list, field: { name: item, label: 'Пункт', widget: string } }
      - { name: novosti, label: 'Страница «Новости»', widget: object, collapsed: true, fields: [{ name: title, label: 'Заголовок', widget: string }, { name: lead, label: 'Подзаголовок', widget: text }] }
      - { name: cta, label: 'Призыв записаться внизу страниц', widget: object, collapsed: true, fields: [{ name: title, label: 'Заголовок', widget: string }, { name: text, label: 'Текст', widget: text }, { name: button, label: 'Текст кнопки', widget: string }] }

collections:
  - name: news
    label: 'Новости и статьи'
    label_singular: 'новость'
    description: 'Нажмите «Создать», чтобы добавить новость или статью'
    icon: newspaper
    folder: content/news
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{date}} · {{title}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: 'Заголовок', widget: string }
      - { name: date, label: 'Дата', widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false }
      - { name: excerpt, label: 'Коротко — для карточки новости', widget: text }
      - { name: cover, label: 'Обложка', widget: image, required: false }
      - { name: body, label: 'Текст', widget: richtext }
      - { name: video, label: 'Видео (необязательно)', widget: file, required: false, hint: 'Ссылка VK Видео, Rutube, YouTube или файл mp4' }
      - { name: url, label: 'Адрес латиницей (необязательно)', widget: string, required: false, hint: 'Пусто — адрес сделается из заголовка' }
      - { name: hidden, label: 'Скрыть с сайта', widget: boolean, required: false, default: false }

  - name: docs
    label: 'Документы'
    label_singular: 'документ'
    description: 'Оферта, политика и согласия. Ссылки на них сами появляются в подвале и у галочек в формах'
    icon: description
    folder: content/docs
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{order}}. {{title}}'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: 'Название', widget: string }
      - { name: body, label: 'Текст документа', widget: richtext }
      - { name: order, label: 'Порядок в списке', widget: number, value_type: int, default: 10 }
      - { name: url, label: 'Адрес латиницей (необязательно)', widget: string, required: false, hint: 'У согласий не менять: на них ведут галочки в формах' }
      - { name: hidden, label: 'Скрыть с сайта', widget: boolean, required: false, default: false }

  - name: pages
    label: 'Новые страницы (конструктор)'
    label_singular: 'страницу'
    description: 'Страница из готовых блоков — например, под рекламу. Для A/B-теста: меню ⋮ → «Дублировать», затем поменяйте адрес и тексты'
    icon: dashboard_customize
    folder: content/pages
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{title}} → /{{url}}/'
    fields:
      - { name: title, label: 'Название страницы', widget: string }
      - { name: url, label: 'Адрес латиницей', widget: string, pattern: ['^(?!(uslugi|sait|o-nas|voprosy|kontakty|novosti|dokumenty|brief|admin|img|js|fonts)$)[a-z0-9]+(-[a-z0-9]+)*$', 'Латиница и цифры через дефис. Адреса разделов сайта (uslugi, novosti и т. п.) заняты'], hint: 'reklama-wb → сайт/reklama-wb/. У копии для A/B-теста сразу поменяйте адрес' }
      - { name: description, label: 'Описание для поиска и соцсетей', widget: text, required: false }
      - { name: hidden, label: 'Скрыть с сайта', widget: boolean, required: false, default: false }
      - name: blocks
        label: 'Блоки страницы'
        label_singular: 'блок'
        hint: 'Добавляйте блоки и меняйте порядок перетаскиванием'
        widget: list
        collapsed: auto
        types:
          - name: hero
            label: 'Первый экран'
            widget: object
            summary: '{{fields.title}}'
            fields:
              - { name: chip, label: 'Надпись над заголовком', widget: string, required: false }
              - { name: title, label: 'Заголовок', widget: string, hint: '*Слова в звёздочках* выделяются зелёным' }
              - { name: text, label: 'Подзаголовок', widget: text, required: false }
              - { name: button, label: 'Текст кнопки', widget: string, required: false }
              - { name: button_link, label: 'Куда ведёт кнопка', widget: string, required: false, hint: 'Пусто — откроется окно записи на консультацию' }
              - { name: image, label: 'Картинка справа', widget: image, required: false }
          - name: text
            label: 'Текст'
            widget: object
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: 'Заголовок', widget: string, required: false }
              - { name: body, label: 'Текст', widget: richtext }
          - name: image
            label: 'Фото'
            widget: object
            fields:
